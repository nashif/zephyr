description: |
    OSRAM ams TSL2561 light sensor.

    Also supports the TSL2563, which has the same registers and lux equation and
    differs in its part number.

compatible: "ams,tsl2561"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  integration-time:
    type: int
    default: 402
    description: |
      ADC integration time in ms. The default value matches Timing Register's value at power on.
    enum:
      - 13
      - 101
      - 402
  glass-attenuation:
    type: int
    default: 100000
    description: |
      Light attenuation of the glass over the sensor: the reported
      illuminance is multiplied by it. Integer value with 5 decimals; the
      default (1.00000) is for an uncovered sensor. Example: 16 would be
      1600000.

  gain:
    type: int
    default: 16
    description: |
      ADC gain factor. The default value matches Timing Register's value at power on.
    enum:
      - 1
      - 16
